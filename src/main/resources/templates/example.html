<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>哈基米</title>
</head>
<body>
    <h1>哈基米哦南北绿豆</h1>
    <h2>안녕하세요!!<span th:text="${name}"></span></h2>
    <table>
        <tr th:each="item : ${articles}">
            <td th:text="${item.title}"></td>
            <td th:text="${item.content}"></td>
        </tr>
    </table>

<!--    <div>-->
<!--        <p th:text="${person.name}"></p>-->
<!--        <p th:text="${person.age}"></p>-->
<!--        <p th:text="${person.id}"></p>-->
<!--    </div>-->
    <div th:object="${person}">
        <p th:text="|이름: *{name}|"></p>
        <p th:text="|나이: *{age}|"></p>
        <p th:text="|아이디: *{id}|"></p>
        <ul th:each="h:*{hobbies}">
            <li th:text="${h}"></li>
        </ul>
    </div>

    <hr>

    <div th:if="${error!=null}">
        에러가 발생했습니다!!!
    </div>

    <div th:unless="${error!=null}">
        정상 작동 중!!!
    </div>

    <div th:if="${error==null}">
        정상 작동 중!!!
    </div>


</body>
</html>
